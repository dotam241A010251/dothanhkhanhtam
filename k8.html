<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập K8 - Tính Chỉ Số BMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .container {
            max-width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tính Chỉ Số BMI</h2>
        <div class="form-group">
            <label for="weight">Cân nặng (kg):</label>
            <input type="number" id="weight" placeholder="Nhập cân nặng (ví dụ: 60)">
        </div>
        <div class="form-group">
            <label for="height">Chiều cao (m):</label>
            <input type="number" step="0.01" id="height" placeholder="Nhập chiều cao (ví dụ: 1.7)">
        </div>
        <button onclick="tinhBMI()">Tính BMI</button>
        
        <div id="result"></div>
    </div>

    <script>
        function tinhBMI() {
            // Lấy giá trị từ input
            const weightInput = document.getElementById('weight').value;
            const heightInput = document.getElementById('height').value;
            const resultDiv = document.getElementById('result');

            // Kiểm tra xem người dùng đã nhập đủ dữ liệu chưa
            if (weightInput === "" || heightInput === "") {
                resultDiv.innerHTML = "Vui lòng nhập đầy đủ cân nặng và chiều cao!";
                resultDiv.style.color = "red";
                return;
            }

            const weight = parseFloat(weightInput);
            const height = parseFloat(heightInput);

            // Kiểm tra giá trị hợp lệ
            if (weight <= 0 || height <= 0) {
                resultDiv.innerHTML = "Cân nặng và chiều cao phải lớn hơn 0!";
                resultDiv.style.color = "red";
                return;
            }

            // Công thức tính BMI: cân nặng / (chiều cao * chiều cao)
            const bmi = weight / (height * height);
            let phanLoai = "";

            // Phân loại dựa trên chỉ số BMI chuẩn (WHO)
            if (bmi < 18.5) {
			phanLoai = "Thiếu cân";
            } else if (bmi >= 18.5 && bmi < 25) {
                phanLoai = "Bình thường";
            } else {
                phanLoai = "Thừa cân";
            }

            // Hiển thị kết quả ra màn hình
            resultDiv.style.color = "#333";
            resultDiv.innerHTML = `Chỉ số BMI của bạn là: <strong>${bmi.toFixed(2)}</strong> (${phanLoai})`;
        }
    </script>

</body>
</html>
